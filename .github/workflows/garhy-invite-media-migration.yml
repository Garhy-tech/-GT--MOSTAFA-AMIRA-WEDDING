name: GARHY INVITE Media Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/garhy-invite-media-migration.yml'

permissions:
  contents: write

jobs:
  migrate-live-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_ORIGIN: https://mostafa-amira-2026.vercel.app
      LEGACY_IMMUTABLE_ORIGIN: https://mostafa-amira-2026-rbi4w8d0t-garhy.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved production assets byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            'assets/css/style.css'
            'assets/icons/app-icon-3d.avif'
            'assets/icons/app-icon-3d.webp'
            'assets/icons/icon-512.png'
            'assets/icons/favicon.png'
            'assets/icons/apple-touch-icon.png'
            'assets/images/og-operation-forever.jpg'
            'assets/images/hero/hero-wedding-story.avif'
            'assets/images/hero/hero-wedding-story.webp'
            'assets/images/hero/hero-wedding-story.jpg'
            'assets/images/couple/couple.avif'
            'assets/images/couple/couple.webp'
            'assets/images/couple/couple.jpg'
            'assets/images/event/ballroom.avif'
            'assets/images/event/ballroom.webp'
            'assets/images/event/ballroom.jpg'
            'assets/images/gallery/gallery-01.jpg'
            'assets/images/gallery/gallery-03.jpg'
            'assets/images/gallery/gallery-06.jpg'
            'assets/images/gallery/gallery-05.jpg'
            'assets/images/gallery/gallery-02.jpg'
            'assets/images/location/palace.jpg'
            'assets/audio/daweta-zewace.m4a'
            'assets/audio/daweta-zewace.mp3'
          )

          for src in "${paths[@]}"; do
            dst="assets/v2/${src#assets/}"
            mkdir -p "$(dirname "$dst")"
            echo "Downloading $src -> $dst"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              "$SOURCE_ORIGIN/$src" -o "$dst"
            test -s "$dst"
          done

      - name: Validate media signatures and sizes
        shell: bash
        run: |
          set -euo pipefail
          file --mime-type assets/v2/images/hero/hero-wedding-story.jpg
          file --mime-type assets/v2/images/hero/hero-wedding-story.avif
          file --mime-type assets/v2/images/hero/hero-wedding-story.webp
          file --mime-type assets/v2/icons/icon-512.png
          file --mime-type assets/v2/audio/daweta-zewace.m4a
          file --mime-type assets/v2/audio/daweta-zewace.mp3

          test "$(stat -c%s assets/v2/images/hero/hero-wedding-story.jpg)" -gt 10000
          test "$(stat -c%s assets/v2/icons/icon-512.png)" -gt 1000
          test "$(stat -c%s assets/v2/audio/daweta-zewace.m4a)" -gt 10000
          test "$(stat -c%s assets/v2/audio/daweta-zewace.mp3)" -gt 10000

          find assets/v2 -type f ! -name SHA256SUMS.txt -print | sort | xargs sha256sum > assets/v2/SHA256SUMS.txt

      - name: Audit CSS external or relative assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'CSS url() references:'
          grep -oE 'url\([^)]*\)' assets/v2/css/style.css || true

      - name: Localize GARHY INVITE V2 assets and tighten CSP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          immutable = 'https://mostafa-amira-2026-rbi4w8d0t-garhy.vercel.app'

          index_path = Path('app-v2/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(f'{immutable}/assets/', '/assets/v2/')
          index_path.write_text(index, encoding='utf-8')

          event_path = Path('app-v2/event.json')
          event = json.loads(event_path.read_text(encoding='utf-8'))
          event['assetOrigin'] = '/assets/v2'
          event_path.write_text(json.dumps(event, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          vercel_path = Path('vercel.json')
          vercel = json.loads(vercel_path.read_text(encoding='utf-8'))
          for rule in vercel.get('headers', []):
              for header in rule.get('headers', []):
                  if header.get('key', '').lower() == 'content-security-policy':
                      header['value'] = header['value'].replace(f' {immutable}', '')
          vercel_path.write_text(json.dumps(vercel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          if grep -R --fixed-strings "$LEGACY_IMMUTABLE_ORIGIN/assets/" app-v2/index.html app-v2/event.json vercel.json; then
            echo 'Legacy asset origin still present after localization.' >&2
            exit 1
          fi

      - name: Commit migrated and localized release assets
        shell: bash
        run: |
          set -euo pipefail
          git add assets/v2 app-v2/index.html app-v2/event.json vercel.json
          if git diff --cached --quiet; then
            echo 'No media or localization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: localize GARHY INVITE V2 media'
          git push origin HEAD:main
