name: GARHY INVITE Domain Bind

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/garhy-invite-domain-bind.yml'

permissions:
  contents: read

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_mZ52AwdCUXSmkLKH3YMqqf5U
      VERCEL_PROJECT_ID: prj_7r5uJUxlMQ6odx99vehYHYBIXJC3
      DOMAIN: invite.garhy.ai
      PROJECT: mostafa-amira-2026
    steps:
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test "$VERCEL_PROJECT_ID" = 'prj_7r5uJUxlMQ6odx99vehYHYBIXJC3'
          test "$DOMAIN" = 'invite.garhy.ai'

      - name: Inspect apex domain
        shell: bash
        run: |
          set +e
          npx --yes vercel@latest domains inspect garhy.ai --scope=garhy --token="$VERCEL_TOKEN" | tee /tmp/apex.txt
          exit 0

      - name: Add subdomain to production project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest domains add "$DOMAIN" "$PROJECT" --scope=garhy --token="$VERCEL_TOKEN"

      - name: Inspect subdomain requirements
        shell: bash
        run: |
          set +e
          npx --yes vercel@latest domains inspect "$DOMAIN" --scope=garhy --token="$VERCEL_TOKEN" | tee /tmp/domain.txt
          exit 0

      - name: Verify HTTPS if DNS is ready
        shell: bash
        run: |
          set +e
          curl -fsSIL --max-time 20 "https://$DOMAIN/" | tee /tmp/http.txt
          exit 0
