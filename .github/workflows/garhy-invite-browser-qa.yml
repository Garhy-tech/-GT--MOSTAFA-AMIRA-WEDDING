name: GARHY INVITE Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-v2/**'
      - 'platform/runtime/**'
      - 'tests/e2e/**'
      - 'vercel.json'
      - '.github/workflows/garhy-invite-browser-qa.yml'
  pull_request:
    paths:
      - 'app-v2/**'
      - 'platform/runtime/**'
      - 'tests/e2e/**'
      - 'vercel.json'

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/garhy-invite-http.log 2>&1 &
          echo $! > /tmp/garhy-invite-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/app-v2/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/garhy-invite-http.log
          exit 1

      - name: Run browser QA
        run: node tests/e2e/visual-smoke.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garhy-invite-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/*.png
          if-no-files-found: warn
          retention-days: 14
