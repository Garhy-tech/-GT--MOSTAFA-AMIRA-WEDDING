name: Cleanup MOHAMED A Vercel Deployments

on:
  push:
    branches:
      - feature/mohamed-a-festival-2026
    paths:
      - '.github/workflows/cleanup-mohamed-a-vercel-deployments.yml'

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: cleanup old Mohamed A Vercel deployments'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_mZ52AwdCUXSmkLKH3YMqqf5U
      PROJECT_ID: prj_DOjp0YIOEv12dQXDggbEoAnEQrmZ
      KEEP_DEPLOYMENT_ID: dpl_CPdw7hVYH5PJpWAgfP7zEDTqPvai
    steps:
      - name: Validate cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test "$PROJECT_ID" = 'prj_DOjp0YIOEv12dQXDggbEoAnEQrmZ'
          test "$KEEP_DEPLOYMENT_ID" = 'dpl_CPdw7hVYH5PJpWAgfP7zEDTqPvai'

      - name: Delete every older deployment and preserve the latest
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          ids_file="$(mktemp)"
          : > "$ids_file"
          until_cursor=''

          while :; do
            url="$api/v7/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=100"
            if [ -n "$until_cursor" ]; then
              url="$url&until=$until_cursor"
            fi
            curl -fsS "${auth[@]}" "$url" -o /tmp/vercel-deployments.json
            jq -r '.deployments[] | (.uid // .id)' /tmp/vercel-deployments.json >> "$ids_file"
            next="$(jq -r '.pagination.next // empty' /tmp/vercel-deployments.json)"
            [ -n "$next" ] || break
            [ "$next" != "$until_cursor" ] || break
            until_cursor="$next"
          done

          sort -u "$ids_file" -o "$ids_file"
          grep -Fxq "$KEEP_DEPLOYMENT_ID" "$ids_file"

          total="$(wc -l < "$ids_file" | tr -d ' ')"
          deleted=0
          failures=0

          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            if [ "$deployment_id" = "$KEEP_DEPLOYMENT_ID" ]; then
              continue
            fi
            status="$(curl -sS -o /tmp/vercel-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/v13/deployments/$deployment_id?teamId=$TEAM_ID")"
            if [ "$status" = '200' ]; then
              state="$(jq -r '.state // empty' /tmp/vercel-delete.json)"
              uid="$(jq -r '.uid // empty' /tmp/vercel-delete.json)"
              if [ "$state" = 'DELETED' ] && [ "$uid" = "$deployment_id" ]; then
                deleted=$((deleted+1))
              else
                echo "Unexpected delete response for $deployment_id" >&2
                cat /tmp/vercel-delete.json >&2
                failures=$((failures+1))
              fi
            else
              echo "Failed to delete $deployment_id (HTTP $status)" >&2
              cat /tmp/vercel-delete.json >&2 || true
              failures=$((failures+1))
            fi
          done < "$ids_file"

          echo "Found $total deployments; deleted $deleted older deployments; failures $failures."
          [ "$failures" -eq 0 ]

      - name: Verify exactly one deployment remains
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          curl -fsS "${auth[@]}" "$api/v7/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=100" -o /tmp/vercel-after.json
          count="$(jq '.deployments | length' /tmp/vercel-after.json)"
          remaining="$(jq -r '.deployments[0] | (.uid // .id)' /tmp/vercel-after.json)"
          test "$count" -eq 1
          test "$remaining" = "$KEEP_DEPLOYMENT_ID"
          {
            echo '## MOHAMED × A Vercel cleanup'
            echo
            echo "✅ Preserved only: $KEEP_DEPLOYMENT_ID"
            echo '✅ All older deployments removed.'
            echo '✅ No other Vercel project was touched.'
          } >> "$GITHUB_STEP_SUMMARY"
