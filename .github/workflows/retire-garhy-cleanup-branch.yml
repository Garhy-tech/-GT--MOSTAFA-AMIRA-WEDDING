name: Retire completed GARHY cleanup branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  retire:
    if: github.event.action == 'reopened' && github.event.pull_request.head.ref == 'ops/vercel-cleanup-preflight-20260830'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only this completed temporary branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'ops/vercel-cleanup-preflight-20260830';
            const { owner, repo } = context.repo;

            if (context.payload.pull_request.head.ref !== branch) {
              throw new Error('Safety gate failed: unexpected branch.');
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: 'heads/' + branch,
            });

            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
              throw new Error('Post-delete verification failed: temporary branch still exists.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await core.summary
              .addHeading('GARHY cleanup branch retired')
              .addRaw('\nDeleted temporary branch: ' + branch + '\n')
              .write();
