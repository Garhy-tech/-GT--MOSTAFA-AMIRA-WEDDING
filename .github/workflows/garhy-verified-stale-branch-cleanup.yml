name: GARHY verified stale branch cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/garhy-verified-stale-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete only verified stale branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Re-verify and delete exact stale branch
        uses: actions/github-script@v7
        with:
          script: |
            const staleBranch = 'preview/yahia-amira-final-20260829';
            const { owner, repo } = context.repo;

            if (!process.env.VERCEL_TOKEN) {
              core.setFailed('VERCEL_TOKEN is unavailable to verify Vercel deployment references.');
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: 'main',
              head: staleBranch,
            });
            if (comparison.data.ahead_by !== 0) {
              throw new Error('Safety gate failed: branch has unique commits.');
            }

            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: owner + ':' + staleBranch,
              per_page: 100,
            });
            if (openPullRequests.length !== 0) {
              throw new Error('Safety gate failed: branch has an open pull request.');
            }

            const branchInfo = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: staleBranch,
            });
            if (branchInfo.data.protected) {
              throw new Error('Safety gate failed: branch is protected.');
            }

            const vercelResponse = await fetch(
              'https://api.vercel.com/v6/deployments?projectId=prj_7r5uJUxlMQ6odx99vehYHYBIXJC3&teamId=team_mZ52AwdCUXSmkLKH3YMqqf5U&branch=' + encodeURIComponent(staleBranch),
              { headers: { Authorization: 'Bearer ' + process.env.VERCEL_TOKEN } },
            );
            if (!vercelResponse.ok) {
              throw new Error('Vercel reference check failed with ' + vercelResponse.status);
            }
            const vercelData = await vercelResponse.json();
            if ((vercelData.deployments || []).length !== 0) {
              throw new Error('Safety gate failed: Vercel deployments still reference the branch.');
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: 'heads/' + staleBranch,
            });

            try {
              await github.rest.repos.getBranch({ owner, repo, branch: staleBranch });
              throw new Error('Post-delete verification failed: branch still exists.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await core.summary
              .addHeading('GARHY verified stale branch cleanup')
              .addRaw('\nDeleted: ' + staleBranch + '\n')
              .addRaw('No unique commits, open PRs, protection, or Vercel deployment references were present.\n')
              .write();
