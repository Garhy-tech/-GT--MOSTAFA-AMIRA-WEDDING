name: Retire verified bank manual preview clutter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  retire:
    if: github.event.pull_request.head.ref == 'ops/retire-bank-manual-preview-clutter-20260830'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Re-verify and retire only old empty manual previews
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.VERCEL_TOKEN;
            if (!token) {
              core.setFailed('VERCEL_TOKEN is unavailable.');
              return;
            }

            const teamId = 'team_mZ52AwdCUXSmkLKH3YMqqf5U';
            const projectId = 'prj_Y6mgWCmrkhrcAgYVmSueGkBghZyB';
            const productionId = 'dpl_FBE9Z8uqJt9UB8Tj7z4mw9vpLKEK';
            const temporaryBranch = 'ops/retire-bank-manual-preview-clutter-20260830';

            async function api(path, init = {}) {
              const response = await fetch('https://api.vercel.com' + path, {
                ...init,
                headers: { Authorization: 'Bearer ' + token, ...(init.headers || {}) },
              });
              return response;
            }

            async function details(id) {
              const response = await api('/v13/deployments/' + encodeURIComponent(id) + '?teamId=' + encodeURIComponent(teamId));
              if (!response.ok) throw new Error('Unable to inspect ' + id + ': ' + response.status);
              return response.json();
            }

            const production = await details(productionId);
            if (!(production.id === productionId
              && production.project && production.project.id === projectId
              && production.readyState === 'READY'
              && production.target === 'production')) {
              throw new Error('Safety gate failed: production anchor changed.');
            }

            const listingResponse = await api('/v6/deployments?projectId=' + encodeURIComponent(projectId) + '&teamId=' + encodeURIComponent(teamId) + '&limit=100');
            if (!listingResponse.ok) throw new Error('Unable to list deployments: ' + listingResponse.status);
            const listing = await listingResponse.json();
            const candidateIds = (listing.deployments || [])
              .filter((deployment) => !deployment.target && deployment.id !== productionId)
              .map((deployment) => deployment.id || deployment.uid)\n              .filter(Boolean);

            const deleted = [];
            const held = [];
            for (const id of candidateIds) {
              const deployment = await details(id);
              const aliases = deployment.alias || [];
              const githubMetadata = Object.keys(deployment.meta || {}).some((key) => key.toLowerCase().startsWith('github'));
              const safe = deployment.project && deployment.project.id === projectId
                && deployment.readyState === 'READY'
                && !deployment.target
                && aliases.length === 0
                && !deployment.source
                && !githubMetadata
                && deployment.createdAt < production.createdAt;

              if (!safe) {
                held.push(id);
                continue;
              }

              const deletionResponse = await api(
                '/v13/deployments/' + encodeURIComponent(id) + '?teamId=' + encodeURIComponent(teamId),
                { method: 'DELETE' },
              );
              if (![200, 202, 204].includes(deletionResponse.status)) {
                throw new Error('Delete failed with ' + deletionResponse.status + ' for ' + id);
              }

              const verificationResponse = await api(
                '/v13/deployments/' + encodeURIComponent(id) + '?teamId=' + encodeURIComponent(teamId),
              );
              if (![404, 410].includes(verificationResponse.status)) {
                throw new Error('Post-delete verification failed for ' + id + ' with ' + verificationResponse.status);
              }
              deleted.push(id);
            }

            const { owner, repo } = context.repo;
            await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + temporaryBranch });

            await core.summary
              .addHeading('GARHY bank manual preview cleanup')
              .addCodeBlock(JSON.stringify({ deleted, held }, null, 2), 'json')
              .addRaw('\nDeleted only previews that remained empty, manual, non-production, unaliased, and older than production.\n')
              .write();
