name: GARHY INVITE Vercel Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/garhy-invite-vercel-preview.yml'
      - 'deploy/vercel.preview.json'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_mZ52AwdCUXSmkLKH3YMqqf5U
      VERCEL_PROJECT_ID: prj_IGvUFSpbw066ZLUfvIezMdZNIFEy
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RELEASE_DIR: .garhy-release
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4

      - name: Preview deployment preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '## GARHY INVITE Vercel Preview'
              echo
              echo 'Preview deployment was not attempted because repository secret `VERCEL_TOKEN` is not configured.'
              echo 'The workflow is intentionally restricted to the isolated preview project and never uses `--prod`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Assemble V2-only release directory
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/app-v2" "$RELEASE_DIR/platform/runtime" "$RELEASE_DIR/assets"

          cp app-v2/index.html "$RELEASE_DIR/index.html"
          cp app-v2/styles.css "$RELEASE_DIR/app-v2/styles.css"
          cp app-v2/app.js "$RELEASE_DIR/app-v2/app.js"
          cp app-v2/event.json "$RELEASE_DIR/app-v2/event.json"
          cp app-v2/supabase-config.js "$RELEASE_DIR/app-v2/supabase-config.js"
          cp platform/runtime/core.js "$RELEASE_DIR/platform/runtime/core.js"
          cp -R assets/v2 "$RELEASE_DIR/assets/v2"
          cp deploy/vercel.preview.json "$RELEASE_DIR/vercel.json"

          test -s "$RELEASE_DIR/index.html"
          test -s "$RELEASE_DIR/app-v2/event.json"
          test -s "$RELEASE_DIR/platform/runtime/core.js"
          test -d "$RELEASE_DIR/assets/v2"

      - name: Pull isolated preview project configuration
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: npx --yes vercel@latest pull --yes --environment=preview --cwd "$RELEASE_DIR" --token="$VERCEL_TOKEN"

      - name: Deploy isolated V2 static preview
        if: steps.preflight.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --yes --cwd "$RELEASE_DIR" --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > vercel-preview-url.txt
          {
            echo '## GARHY INVITE Vercel Preview'
            echo
            echo "Deployment: $url"
            echo
            echo 'Source: direct static V2-only release directory.'
            echo 'Target: isolated `garhy-invite-v2-preview` project. Production aliases and GARHY domains were not modified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview URL record
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: garhy-invite-vercel-preview-${{ github.sha }}
          path: vercel-preview-url.txt
          retention-days: 14
