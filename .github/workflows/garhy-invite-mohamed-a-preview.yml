name: GARHY INVITE MOHAMED A Preview

on:
  push:
    branches:
      - feature/mohamed-a-festival-2026
    paths:
      - '.github/workflows/garhy-invite-mohamed-a-preview.yml'
      - 'projects/mohamed-a-2026/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/garhy-invite-mohamed-a-preview.yml'
      - 'projects/mohamed-a-2026/**'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_mZ52AwdCUXSmkLKH3YMqqf5U
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_NAME: garhy-invite-mohamed-a-2026-preview
      PROJECT_DIR: projects/mohamed-a-2026
      RELEASE_DIR: /tmp/garhy-invite-mohamed-a-release
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6

      - name: Preview deployment preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Validate isolated client source
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html intro.css intro.js styles.css responsive.css polish.css gallery.css app.js polish.js music.js event.json vercel.json; do test -s "$PROJECT_DIR/$file"; done
          test -s "$PROJECT_DIR/media/jamaican-bam-bam.ogg"
          test -s "$PROJECT_DIR/media/cha-ching.ogg"
          test -s "$PROJECT_DIR/media/ads/gt-ad-strip.b64"
          test "$(stat -c%s "$PROJECT_DIR/media/jamaican-bam-bam.ogg")" -gt 350000
          test "$(stat -c%s "$PROJECT_DIR/media/jamaican-bam-bam.ogg")" -lt 500000
          test "$(stat -c%s "$PROJECT_DIR/media/cha-ching.ogg")" -lt 20000
          node --check "$PROJECT_DIR/intro.js"
          node --check "$PROJECT_DIR/music.js"
          python - <<'PY'
          import base64, json
          from pathlib import Path
          root=Path('projects/mohamed-a-2026')
          data=json.loads((root/'event.json').read_text(encoding='utf-8'))
          assert data['slug']=='mohamed-a-2026' and data['rsvp'] is False
          raw=base64.b64decode(''.join((root/'media/ads/gt-ad-strip.b64').read_text().split()),validate=True)
          assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP' and len(raw)<30000
          PY
          grep -Fq './media/jamaican-bam-bam.ogg' "$PROJECT_DIR/intro.js"
          grep -Fq './media/cha-ching.ogg' "$PROJECT_DIR/intro.js"
          grep -Fq 'navigator.vibrate' "$PROJECT_DIR/intro.js"
          grep -Fq './media/ads/gt-ad-strip.b64' "$PROJECT_DIR/music.js"
          grep -Fq 'data-gt-ads' "$PROJECT_DIR/music.js"
          grep -Fq "media-src 'self'" "$PROJECT_DIR/vercel.json"
          grep -Fq "connect-src 'self'" "$PROJECT_DIR/vercel.json"
          ! grep -RIE 'service[_-]?role|sb_secret_|SUPABASE_SERVICE_ROLE' "$PROJECT_DIR" --exclude='*.md'

      - name: Resolve and harden isolated Vercel project
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          endpoint="https://api.vercel.com/v9/projects/$PROJECT_NAME?teamId=$VERCEL_ORG_ID"
          status="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' "${auth[@]}" "$endpoint")"
          [ "$status" = '200' ] || { echo "Failed to inspect isolated Vercel project (HTTP $status)." >&2; cat /tmp/vercel-project.json >&2; exit 1; }
          project_id="$(jq -r '.id // empty' /tmp/vercel-project.json)"
          test -n "$project_id"
          echo "VERCEL_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          patch_status="$(curl -sS -o /tmp/vercel-project-patch.json -w '%{http_code}' -X PATCH "${auth[@]}" -H 'Content-Type: application/json' "https://api.vercel.com/v9/projects/$project_id?teamId=$VERCEL_ORG_ID" --data '{"enablePreviewFeedback":false,"enableProductionFeedback":false}')"
          [ "$patch_status" = '200' ]

      - name: Assemble release outside Git root
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/.vercel" "$RELEASE_DIR/media/ads"
          for file in index.html intro.css intro.js styles.css responsive.css polish.css gallery.css app.js polish.js music.js event.json vercel.json; do cp "$PROJECT_DIR/$file" "$RELEASE_DIR/$file"; done
          cp "$PROJECT_DIR/media/jamaican-bam-bam.ogg" "$RELEASE_DIR/media/jamaican-bam-bam.ogg"
          cp "$PROJECT_DIR/media/cha-ching.ogg" "$RELEASE_DIR/media/cha-ching.ogg"
          cp "$PROJECT_DIR/media/ads/gt-ad-strip.b64" "$RELEASE_DIR/media/ads/gt-ad-strip.b64"
          jq -n --arg orgId "$VERCEL_ORG_ID" --arg projectId "$VERCEL_PROJECT_ID" --arg projectName "$PROJECT_NAME" '{orgId:$orgId,projectId:$projectId,projectName:$projectName}' > "$RELEASE_DIR/.vercel/project.json"

      - name: Deploy isolated preview
        if: steps.preflight.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(cd "$RELEASE_DIR" && npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          case "$url" in https://*) ;; *) echo "Vercel did not return a deployment URL: $url" >&2; exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > mohamed-a-preview-url.txt

      - name: Verify deployed preview and headers
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl / --deployment "$PREVIEW_URL" > /tmp/root.html
          grep -Fq 'MOHAMED' /tmp/root.html
          grep -Fq 'قاعة شهرزاد' /tmp/root.html
          for asset in intro.js music.js gallery.css; do npx --yes vercel@latest curl "/$asset" --deployment "$PREVIEW_URL" > "/tmp/$asset"; test -s "/tmp/$asset"; done
          grep -Fq './media/jamaican-bam-bam.ogg' /tmp/intro.js
          grep -Fq './media/cha-ching.ogg' /tmp/intro.js
          grep -Fq 'navigator.vibrate' /tmp/intro.js
          grep -Fq './media/ads/gt-ad-strip.b64' /tmp/music.js
          grep -Fq '.gt-ad-showcase' /tmp/gallery.css
          npx --yes vercel@latest curl /media/jamaican-bam-bam.ogg --deployment "$PREVIEW_URL" -I > /tmp/music-headers.txt
          grep -Eiq 'content-type: audio/ogg' /tmp/music-headers.txt
          npx --yes vercel@latest curl /media/cha-ching.ogg --deployment "$PREVIEW_URL" -I > /tmp/chime-headers.txt
          grep -Eiq 'content-type: audio/ogg' /tmp/chime-headers.txt
          npx --yes vercel@latest curl /media/ads/gt-ad-strip.b64 --deployment "$PREVIEW_URL" > /tmp/ad.b64
          test -s /tmp/ad.b64
          npx --yes vercel@latest curl / --deployment "$PREVIEW_URL" -I > /tmp/headers.txt
          tr '[:upper:]' '[:lower:]' < /tmp/headers.txt > /tmp/headers-lower.txt
          grep -Fq "content-security-policy:" /tmp/headers-lower.txt
          grep -Fq "media-src 'self'" /tmp/headers-lower.txt
          grep -Fq "connect-src 'self'" /tmp/headers-lower.txt
          grep -Fq 'cache-control: no-store' /tmp/headers-lower.txt
          grep -Fq 'x-robots-tag: noindex' /tmp/headers-lower.txt
          {
            echo '## MOHAMED × A Vercel Preview'
            echo
            echo "Deployment: $PREVIEW_URL"
            echo
            echo '✅ First-gesture Jamaican soundtrack verified.'
            echo '✅ Cha-Ching + vibration interaction contract verified.'
            echo '✅ Lazy GARHY TECH ad marquee asset verified.'
            echo '✅ Strict CSP/no-store/noindex headers verified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview URL record
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: garhy-invite-mohamed-a-preview-${{ github.sha }}
          path: mohamed-a-preview-url.txt
          retention-days: 14
