name: GARHY INVITE Production Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/garhy-invite-production-promotion.yml'

permissions:
  contents: read

jobs:
  promote-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_mZ52AwdCUXSmkLKH3YMqqf5U
      VERCEL_PROJECT_ID: prj_7r5uJUxlMQ6odx99vehYHYBIXJC3
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RELEASE_DIR: .garhy-production-release
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4

      - name: Production promotion preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test "$VERCEL_ORG_ID" = 'team_mZ52AwdCUXSmkLKH3YMqqf5U'
          test "$VERCEL_PROJECT_ID" = 'prj_7r5uJUxlMQ6odx99vehYHYBIXJC3'

      - name: Assemble approved V2 production release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/app-v2" "$RELEASE_DIR/platform/runtime" "$RELEASE_DIR/assets"
          cp app-v2/index.html "$RELEASE_DIR/index.html"
          cp app-v2/styles.css "$RELEASE_DIR/app-v2/styles.css"
          cp app-v2/app.js "$RELEASE_DIR/app-v2/app.js"
          cp app-v2/event.json "$RELEASE_DIR/app-v2/event.json"
          cp app-v2/supabase-config.js "$RELEASE_DIR/app-v2/supabase-config.js"
          cp platform/runtime/core.js "$RELEASE_DIR/platform/runtime/core.js"
          cp -R assets/v2 "$RELEASE_DIR/assets/v2"
          cp deploy/vercel.production.json "$RELEASE_DIR/vercel.json"
          test -s "$RELEASE_DIR/index.html"
          test -s "$RELEASE_DIR/app-v2/event.json"
          test -s "$RELEASE_DIR/platform/runtime/core.js"
          test -d "$RELEASE_DIR/assets/v2"

      - name: Pull original production project configuration
        shell: bash
        run: npx --yes vercel@latest pull --yes --environment=production --cwd "$RELEASE_DIR" --token="$VERCEL_TOKEN"

      - name: Promote approved V2 to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prod --yes --cwd "$RELEASE_DIR" --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > vercel-production-url.txt

      - name: Verify production V2
        shell: bash
        env:
          PROD_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest curl / --deployment "$PROD_URL" > /tmp/garhy-root.html
          grep -Fq 'data-garhy-invite' /tmp/garhy-root.html
          grep -Fq 'A GARHY INVITE Experience' /tmp/garhy-root.html
          if grep -Fq 'Royal Garden Palace' /tmp/garhy-root.html; then
            echo 'Legacy root detected unexpectedly.' >&2
            exit 1
          fi

          npx --yes vercel@latest curl '/?invite=GARHYQAROUTETEST0123456789abcdef' --deployment "$PROD_URL" > /tmp/garhy-personal.html
          grep -Fq 'data-garhy-invite' /tmp/garhy-personal.html

          npx --yes vercel@latest curl /app-v2/event.json --deployment "$PROD_URL" > /tmp/garhy-event.json
          grep -Fq '"slug": "mostafa-amira-2026"' /tmp/garhy-event.json
          grep -Fq '"assetOrigin": "/assets/v2"' /tmp/garhy-event.json

          npx --yes vercel@latest curl /platform/runtime/core.js --deployment "$PROD_URL" > /tmp/garhy-core.js
          grep -Fq 'GarhyInviteCore' /tmp/garhy-core.js

          npx --yes vercel@latest curl /assets/v2/images/hero/hero-wedding-story.jpg --deployment "$PROD_URL" > /tmp/garhy-hero.jpg
          test "$(wc -c < /tmp/garhy-hero.jpg)" -gt 10000

          npx --yes vercel@latest curl /assets/v2/audio/daweta-zewace.mp3 --deployment "$PROD_URL" > /tmp/garhy-audio.mp3
          test "$(wc -c < /tmp/garhy-audio.mp3)" -gt 10000

          {
            echo '## GARHY INVITE Production Promotion'
            echo
            echo "Production deployment: $PROD_URL"
            echo
            echo '✅ GARHY INVITE V2 is serving at production.'
            echo '✅ Query-token invitation entry is reachable.'
            echo '✅ Event config, runtime, hero media, and audio are reachable.'
            echo '✅ Legacy root signature is absent.'
            echo '✅ No custom domain or DNS operation is performed by this workflow.'
            echo
            echo 'Rollback deployment retained: dpl_4f4Eed6xebXjMA8fX1jcVjRAH4bT'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production URL record
        uses: actions/upload-artifact@v4
        with:
          name: garhy-invite-production-${{ github.sha }}
          path: vercel-production-url.txt
          retention-days: 30
