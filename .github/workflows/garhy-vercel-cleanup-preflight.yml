name: GARHY Vercel cleanup preflight

on:
  push:
    branches:
      - ops/vercel-cleanup-preflight-20260830
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    name: Verify deletion candidates without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify exact Vercel candidates
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.VERCEL_TOKEN;
            if (!token) {
              core.setFailed('VERCEL_TOKEN is unavailable to this repository workflow.');
              return;
            }

            const teamId = 'team_mZ52AwdCUXSmkLKH3YMqqf5U';
            const candidates = [
              ['prj_Beg1hNSaC2MbNy6KOGEEWlSNMd6H', 'gt-marketplace-wordpress'],
              ['prj_EIFe4C3RFG3vFKd98FjhBCmTkqAk', 'garhy-platform'],
              ['prj_dl9oPyGzXSXEiOvIFHHIOrGSwKLT', 'yahia-base64-encoding-test'],
              ['prj_nvpsqNhFVqAUWERzupoxJY5yfbKj', 'yahia-sandboxref-test'],
              ['prj_0kOoYFPS4haR6ZmPp3zQI9eIzu7q', 'yahia-atpath-test'],
              ['prj_MKjCosPo2UoHZ3X1EuYDa9dNXCxs', 'yahia-datauri-test'],
              ['prj_NbcpyPpnkKctPh1HI30BmNLLYZP0', 'yahia-amira-deploy-test'],
            ];

            async function api(path) {
              const response = await fetch('https://api.vercel.com' + path, {
                headers: { Authorization: 'Bearer ' + token },
              });
              if (!response.ok) {
                throw new Error('Vercel API ' + response.status + ' for ' + path);
              }
              return response.json();
            }

            const result = [];
            for (const [id, expectedName] of candidates) {
              const project = await api('/v9/projects/' + encodeURIComponent(id) + '?teamId=' + encodeURIComponent(teamId));
              const envResponse = await api('/v9/projects/' + encodeURIComponent(id) + '/env?teamId=' + encodeURIComponent(teamId));
              const deploymentResponse = await api('/v6/deployments?projectId=' + encodeURIComponent(id) + '&teamId=' + encodeURIComponent(teamId) + '&limit=100');

              const domainNames = (project.domains || [])
                .map((domain) => typeof domain === 'string' ? domain : domain.name)
                .filter(Boolean);
              const deployments = deploymentResponse.deployments || [];
              const aliasNames = deployments.flatMap((deployment) => deployment.alias || deployment.aliases || [])
                .map((alias) => typeof alias === 'string' ? alias : alias.domain)
                .filter(Boolean);
              const customDomainCount = domainNames.filter((name) => !name.endsWith('.vercel.app')).length;
              const customAliasCount = aliasNames.filter((name) => !name.endsWith('.vercel.app')).length;
              const envCount = (envResponse.envs || []).length;
              const hasGitLink = Boolean(project.link && (project.link.repo || project.link.repoId || project.link.org));
              const isExplicitTestProject = /^yahia-(base64-encoding|sandboxref|atpath|datauri|amira-deploy)-test$/.test(expectedName);
              const eligible = project.name === expectedName
                && customDomainCount === 0
                && customAliasCount === 0
                && envCount === 0
                && !hasGitLink
                && (isExplicitTestProject || deployments.length === 0);

              result.push({
                id,
                expectedName,
                actualName: project.name,
                deploymentCount: deployments.length,
                productionDeploymentCount: deployments.filter((deployment) => deployment.target === 'production').length,
                customDomainCount,
                customAliasCount,
                envCount,
                hasGitLink,
                classification: eligible ? 'DELETE_ELIGIBLE' : 'HOLD',
              });
            }

            await core.summary
              .addHeading('GARHY Vercel cleanup preflight')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json')
              .addRaw('\nNo Vercel mutations were performed by this workflow.\n')
              .write();

            console.log(JSON.stringify(result));
